services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    ports:
      - "3001:3001"
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@host.docker.internal:54322/postgres"
      DIRECT_DATABASE_URL: "postgresql://postgres:postgres@host.docker.internal:54322/postgres"
      QDRANT_URL: "http://qdrant:6333"
      SUPABASE_URL: "http://host.docker.internal:54321"
      # Network address used by the container differs from the token issuer.
      SUPABASE_JWT_ISSUER: "http://127.0.0.1:54321/auth/v1"
      NODE_ENV: development
      LOG_LEVEL: debug
      REQUESTS_PER_MINUTE: 20
      REQUESTS_PER_DAY: 200
      TZ: Australia/Sydney
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/api/src:/app/src:delegated
      - api_node_modules:/app/node_modules
    depends_on:
      qdrant:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env.local
    environment:
      NODE_ENV: development
      TZ: Australia/Sydney
    volumes:
      - ./apps/web/app:/app/app:delegated
      - ./apps/web/public:/app/public:delegated
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  qdrant_data:
  api_node_modules:
  web_node_modules:
