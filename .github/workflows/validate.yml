name: Validate Schema and API

on:
  pull_request:
    branches:
      - main
    paths:
      - supabase/migrations/**
      - apps/api/src/**
      - apps/api/test/**
      - apps/api/prisma/**
      - apps/api/package.json
      - package.json
      - package-lock.json
      - .github/workflows/validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@df56b21da46c98abb12a9804e4fb1f657773e333 # v2.0.0
        with:
          version: 2.110.0

      - name: Start local Supabase
        run: supabase start

      - name: Lint database schema
        run: supabase db lint --local --fail-on error

      - name: Reset local database
        run: supabase db reset

      - name: Export local Supabase environment
        run: |
          STATUS_OUTPUT=$(supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_PUBLISHABLE_KEY)

          extract_env_value() {
            printf '%s\n' "$STATUS_OUTPUT" \
              | awk -F= -v key="$1" '$1 == key {
                  sub(/^[^=]*=/, "");
                  gsub(/^"|"$/, "");
                  print;
                  exit;
                }'
          }

          SUPABASE_URL_VALUE=$(extract_env_value SUPABASE_URL)
          SUPABASE_PUBLISHABLE_KEY_VALUE=$(extract_env_value SUPABASE_PUBLISHABLE_KEY)
          if [ -z "$SUPABASE_URL_VALUE" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY_VALUE" ]; then
            echo "::error::Supabase status did not provide URL and publishable key"
            exit 1
          fi
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL_VALUE" >> "$GITHUB_ENV"
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY_VALUE" >> "$GITHUB_ENV"

      - name: Set local Supabase environment mapping
        run: |
          echo "NODE_ENV=test" >> "$GITHUB_ENV"
          echo "REQUESTS_PER_MINUTE=20" >> "$GITHUB_ENV"
          echo "REQUESTS_PER_DAY=200" >> "$GITHUB_ENV"
          echo "TEST_DIRECT_DATABASE_URL=postgresql://postgres:postgres@localhost:54322/postgres" >> "$GITHUB_ENV"

      - name: Validate local Supabase environment
        run: |
          node -e 'new URL(process.env.SUPABASE_URL); if (!process.env.SUPABASE_PUBLISHABLE_KEY) process.exit(1)'

      - name: Generate Prisma client
        run: npx -w @victenancy/api prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test -w @victenancy/api

      - name: Integration tests
        run: npm run test:integration -w @victenancy/api
