name: Deploy API Production

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: api-production-deploy
  cancel-in-progress: false

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify staging API workflow succeeded for this commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const SHA = context.sha;

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-api-staging.yml',
              head_sha: SHA,
              status: 'completed',
              per_page: 20,
            });

            if (runs.data.workflow_runs.length === 0) {
              core.setFailed(
                `No deploy-api-staging.yml workflow run found for commit ${SHA}. ` +
                'Push to main or trigger deploy-api-staging.yml first.'
              );
            }

            let foundSuccess = false;
            for (const run of runs.data.workflow_runs) {
              if (run.conclusion === 'success') {
                foundSuccess = true;
                break;
              }
            }

            if (!foundSuccess) {
              core.setFailed(
                `No successful deploy-api-staging.yml run for commit ${SHA}. ` +
                'Ensure staging deployment completed successfully.'
              );
            }

            core.info(
              `Verified: commit ${SHA} has a successful deploy-api-staging.yml run`
            );

  deploy:
    needs: verify-staging
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
    runs-on: ubuntu-latest
    env:
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_state_bucket_name: ${{ vars.AWS_TF_STATE_BUCKET }}
      TF_VAR_supabase_project_ref: ${{ vars.SUPABASE_PROJECT_REF }}
      TF_VAR_supabase_publishable_key: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      TF_VAR_agent_runtime_mode: ${{ vars.AGENT_RUNTIME_MODE }}
      TF_VAR_agent_runtime_invoke_url: ${{ vars.AGENT_RUNTIME_INVOKE_URL }}
      TF_VAR_agent_runtime_execute_api_arn: ${{ vars.AGENT_RUNTIME_EXECUTE_API_ARN }}
      TF_VAR_cors_origins: ${{ vars.CORS_ORIGINS }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate deployment inputs
        env:
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: |
          set -euo pipefail
          if [ -z "${CORS_ORIGINS:-}" ]; then
            echo "::error::CORS_ORIGINS is not configured in the production GitHub environment"
            exit 1
          fi

      - name: Debug OIDC claims
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(echo "${response}" | jq -r '.value')"
          payload_b64="$(echo "${token}" | cut -d '.' -f 2 | tr '_-' '/+')"
          case $((${#payload_b64} % 4)) in
            2) payload_b64="${payload_b64}==" ;;
            3) payload_b64="${payload_b64}=" ;;
          esac
          echo "${payload_b64}" | base64 --decode | jq '{sub, aud, repository, environment, ref}'

      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-api-production
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        with:
          registries: ${{ steps.aws-credentials.outputs.aws-account-id }}

      - name: Retrieve staging image digest
        id: digest
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_REPO_URL="${{ steps.aws-credentials.outputs.aws-account-id }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/victenancy-api"

          DIGEST=$(aws ecr describe-images \
            --repository-name victenancy-api \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          IMAGE_URI="${ECR_REPO_URL}@${DIGEST}"
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "Using image: ${IMAGE_URI}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform fmt
        working-directory: infra/aws
        run: terraform fmt -check -recursive

      - name: Terraform init and validate — production
        working-directory: infra/aws/environments/production
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_TF_STATE_BUCKET }}" \
            -backend-config="key=api/production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"
          terraform validate

      - name: Terraform plan — production
        id: plan
        working-directory: infra/aws/environments/production
        env:
          TF_VAR_image_uri: ${{ steps.digest.outputs.image_uri }}
          TF_VAR_source_git_sha: ${{ github.sha }}
        run: |
          set +e
          terraform plan \
            -detailed-exitcode \
            -out=tfplan \
            -var="image_uri=${{ steps.digest.outputs.image_uri }}" \
            -var="source_git_sha=${{ github.sha }}"
          PLAN_EXIT_CODE=$?
          set -e

          # Terraform detailed exit codes: 0 = no changes, 2 = changes,
          # 1 (and any other value) = an actual planning error.
          if [ "${PLAN_EXIT_CODE}" -ne 0 ] && [ "${PLAN_EXIT_CODE}" -ne 2 ]; then
            echo "Terraform plan failed with exit code ${PLAN_EXIT_CODE}."
            exit "${PLAN_EXIT_CODE}"
          fi

          echo "Terraform plan completed with exit code ${PLAN_EXIT_CODE}."

      - name: Terraform apply — production
        working-directory: infra/aws/environments/production
        run: terraform apply -auto-approve tfplan

      - name: Smoke test — health
        run: |
          API_URL=$(terraform -chdir=infra/aws/environments/production output -raw api_endpoint)
          echo "Testing ${API_URL}/health"
          curl -fsS "${API_URL}/health" | jq -e '.status == "ok"'

      - name: Smoke test — auth required
        run: |
          API_URL=$(terraform -chdir=infra/aws/environments/production output -raw api_endpoint)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/auth/me")
          if [ "$HTTP_CODE" != "401" ]; then
            echo "::error::Expected 401 from /auth/me without token, got ${HTTP_CODE}"
            exit 1
          fi
