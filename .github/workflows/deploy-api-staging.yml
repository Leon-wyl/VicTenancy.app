name: Deploy API Staging

on:
  push:
    branches:
      - main
    paths:
      - apps/api/src/**
      - apps/api/Dockerfile.lambda
      - apps/api/Dockerfile.lambda.dockerignore
      - apps/api/prisma/**
      - apps/api/package.json
      - apps/api/tsconfig.json
      - apps/api/tsconfig.build.json
      - apps/api/nest-cli.json
      - infra/aws/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-api-staging.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: staging
    runs-on: ubuntu-latest
    env:
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_state_bucket_name: ${{ vars.AWS_TF_STATE_BUCKET }}
      TF_VAR_supabase_project_ref: ${{ vars.SUPABASE_PROJECT_REF }}
      TF_VAR_supabase_publishable_key: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      TF_VAR_github_org: ${{ vars.GITHUB_ORG }}
      TF_VAR_github_repo: ${{ vars.GITHUB_REPO }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        id: aws-credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-api-staging
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        with:
          registries: ${{ steps.aws-credentials.outputs.aws-account-id }}

      - name: Build and push Docker image
        id: build
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_REPO_URL="${{ steps.aws-credentials.outputs.aws-account-id }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/victenancy-api"
          FULL_TAG="${ECR_REPO_URL}:${IMAGE_TAG}"

          docker buildx build \
            --platform linux/amd64 \
            -f apps/api/Dockerfile.lambda \
            -t "${FULL_TAG}" \
            --push \
            .

          DIGEST=$(aws ecr describe-images \
            --repository-name victenancy-api \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          IMAGE_URI="${ECR_REPO_URL}@${DIGEST}"
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform fmt
        working-directory: infra/aws
        run: terraform fmt -check -recursive

      - name: Terraform init and validate — staging
        working-directory: infra/aws/environments/staging
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_TF_STATE_BUCKET }}" \
            -backend-config="key=api/staging/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true"
          terraform validate

      - name: Terraform plan — staging
        id: plan
        working-directory: infra/aws/environments/staging
        env:
          TF_VAR_image_uri: ${{ steps.build.outputs.image_uri }}
          TF_VAR_source_git_sha: ${{ github.sha }}
        run: |
          terraform plan \
            -out=tfplan \
            -var="image_uri=${{ steps.build.outputs.image_uri }}" \
            -var="source_git_sha=${{ github.sha }}"

      - name: Terraform apply — staging
        working-directory: infra/aws/environments/staging
        run: terraform apply -auto-approve tfplan

      - name: Smoke test — health
        run: |
          API_URL=$(terraform -chdir=infra/aws/environments/staging output -raw api_endpoint)
          echo "Testing ${API_URL}/health"
          curl -fsS "${API_URL}/health" | jq -e '.status == "ok"'

      - name: Smoke test — auth required
        run: |
          API_URL=$(terraform -chdir=infra/aws/environments/staging output -raw api_endpoint)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/auth/me")
          if [ "$HTTP_CODE" != "401" ]; then
            echo "::error::Expected 401 from /auth/me without token, got ${HTTP_CODE}"
            exit 1
          fi
